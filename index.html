  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

    #app {

    .search-section {

    #searchInput {

    #status {

      margin: 8px 0 12px;

      font-size: 13px;

    /* --------------------------------------------------
       SIGNETS
    -------------------------------------------------- */

    .signet {
      margin-bottom: 10px;
      padding: 12px 14px 13px;
      border: 1px solid #e1e5ea;
      border-radius: 10px;
      background: #fff;
      transition:
        background 0.15s ease,
        opacity 0.15s ease,
        box-shadow 0.15s ease;
    }

    .signet:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .signet-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .title-button {
      flex: 1;
      padding: 2px 0;
      margin: 0;
      border: 0;
      background: none;
      text-align: left;
      cursor: pointer;

      font-family: Georgia, serif;
      font-size: 19px;
      line-height: 1.35;
      color: #222;
    }

    .title-button:hover {
      color: #1976d2;
    }

    .title-button::before {
      content: "▶";
      display: inline-block;
      margin-right: 8px;

      font-family: Arial, sans-serif;
      font-size: 11px;
      color: #1976d2;

      transition: transform 0.15s ease;
    }

    .signet.open .title-button::before {
      transform: rotate(90deg);
    }

    .external-link {
      flex-shrink: 0;
      padding-top: 4px;

      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #1976d2;
      text-decoration: none;
      white-space: nowrap;
    }

    .external-link:hover {
      text-decoration: underline;
    }

    .article-date {
      margin: 5px 0 0 22px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #888;
    }

    .relevance {
      margin: 7px 0 0 22px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #777;
    }

    /* --------------------------------------------------
       RÉSUMÉ
    -------------------------------------------------- */

    .summary {
      display: none;
      margin: 15px 0 5px 22px;
      padding: 2px 0 2px 16px;

      border-left: 3px solid #dbe7f4;

      font-family: Georgia, serif;
      font-size: 15px;
      line-height: 1.7;
      color: #333;
    }

    .signet.open .summary {
      display: block;
    }

    .summary-section-title {
      margin: 20px 0 10px;
      padding: 6px 10px;

      border-left: 4px solid #1976d2;
      border-radius: 0 6px 6px 0;
      background: #eef5fc;

      font-family: Georgia, serif;
      font-size: 18px;
      line-height: 1.35;
      color: #1769aa;
      font-weight: bold;
    }

    .summary-section-title:first-child {
      margin-top: 2px;
    }

    .summary-paragraph {
      margin: 0 0 12px;
    }

    .summary-list {
      margin: 0 0 13px 20px;
      padding: 0;
    }

    .summary-list li {
      margin-bottom: 6px;
      padding-left: 3px;
    }

    /* --------------------------------------------------
       LU / NON LU
    -------------------------------------------------- */

    .signet-actions {
      display: flex;
      gap: 8px;
      margin: 10px 0 0 22px;
    }

    .read-button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: #fff;
      color: #222;
      font-size: 12px;
      cursor: pointer;
    }

    .read-button:hover {
      background: #f5f5f5;
    }

    .read-button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .signet.read {
      background: #f1f5f2;
      opacity: 0.78;
      padding-left: 14px;
      padding-right: 14px;
    }

    .signet.read .title-button {
      color: #5f6b63;
    }

    .signet.read .summary {
      color: #68736c;
      border-left-color: #cddbd1;
    }

    .signet.read .summary-section-title {
      color: #557060;
      background: #e8f0ea;
      border-left-color: #71917d;
    }

    .signet.read .read-button {
      background: #dce9df;
      color: #3f6549;
    }

    /* --------------------------------------------------
       ABSENCE DE RÉSULTAT
    -------------------------------------------------- */

    #empty {
      padding: 20px 0;
      font-family: Georgia, serif;
      font-size: 15px;
      color: #666;
    }

    /* --------------------------------------------------
       MOBILE
    -------------------------------------------------- */

    @media (max-width: 600px) {

      body {
        padding: 18px 12px;
      }

      header {
        gap: 10px;
      }

      h1 {
        font-size: 22px;
      }

      .subtitle {
        font-size: 13px;
      }

      #logoutBtn {
        padding: 8px 11px;
        font-size: 12px;
      }

      .search-section {
        gap: 6px;
      }

      #searchInput {
        padding: 9px 10px;
        font-size: 13px;
      }

      #searchButton,
      #resetSearchButton {
        padding: 8px 9px;
        font-size: 12px;
      }

      .title-button {
        font-size: 17px;
        line-height: 1.4;
      }

      .external-link {
        font-size: 11px;
      }

      .summary {
        font-size: 14px;
        line-height: 1.6;
      }

      .summary-section-title {
        font-size: 17px;
      }

      .read-button {
        font-size: 11px;
        padding: 6px 9px;
      }
    }
  </style>

  <script>

    /* ==================================================
       SUPABASE
    ================================================== */

    const SUPABASE_URL =
      "https://imehbthvldsqmxobivka.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_voZTwjikja0soirZ1a2bsw_AZNRVsGh";

    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ==================================================
       DOM
    ================================================== */

    const loginSection =
      document.getElementById("loginSection");

    const app =
      document.getElementById("app");

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const userInfo =
      document.getElementById("userInfo");

    const searchInput =
      document.getElementById("searchInput");

    const searchButton =
      document.getElementById("searchButton");

    const resetSearchButton =
      document.getElementById("resetSearchButton");

    const status =
      document.getElementById("status");

    const signetsContainer =
      document.getElementById("signets");

    const empty =
      document.getElementById("empty");


    let allSignets = [];


    /* ==================================================
       UTILITAIRES
    ================================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function normalizeText(text) {

      return String(text || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s]/gu, " ")
        .replace(/\s+/g, " ")
        .trim();

    }


    const STOPWORDS = new Set([
      "a","ai","au","aux","avec","ce","ces","dans","de","des","du",
      "elle","en","es","et","eux","il","ils","je","la","le","les",
      "leur","leurs","lui","ma","mais","me","mes","mon","ne","nos",
      "notre","nous","on","ou","par","pas","pour","que","quel",
      "quelle","quelles","quels","qui","sa","se","sera","ses","son",
      "sur","ta","te","tes","toi","ton","tu","un","une","vos","votre",
      "vous","y"
    ]);


    const CONVERSATIONAL_WORDS = new Set([
      "comment","pourquoi","explique","expliquer","parle","parler",
      "dis","dire","montre","montrer","cherche","chercher","trouve",
      "trouver","donne","donner","quel","quelle","quels","quelles"
    ]);


    function normalizeSearchWord(word) {

      return normalizeText(word)
        .replace(/\s+/g, "");

    }


    function getSignificantWords(query) {

      return normalizeText(query)
        .split(/\s+/)
        .map(normalizeSearchWord)
        .filter(word =>
          word &&
          word.length > 1 &&
          !STOPWORDS.has(word)
        );

    }


    function isConversationalQuery(query) {

      return getSignificantWords(query)
        .some(word =>
          CONVERSATIONAL_WORDS.has(word)
        );

    }


    function wordMatches(queryWord, text) {

      const normalizedText =
        normalizeText(text);

      const words =
        normalizedText.split(/\s+/);

      return words.some(word =>
        word === queryWord ||
        word.startsWith(queryWord) ||
        queryWord.startsWith(word)
      );

    }


    function calculateKeywordScore(query, signet) {

      const queryWords =
        getSignificantWords(query);

      if (!queryWords.length) {
        return 0;
      }

      const text = [
        signet.title,
        signet.titre,
        signet.resume_ia,
        signet.url
      ]
        .filter(Boolean)
        .join(" ");

      let matches = 0;

      for (const queryWord of queryWords) {

        if (wordMatches(queryWord, text)) {
          matches++;
        }

      }

      return matches / queryWords.length;

    }


    /* ==================================================
       PARAMÈTRES RECHERCHE
    ================================================== */

    const SEMANTIC_THRESHOLD = 0.60;
    const CONVERSATIONAL_SEMANTIC_THRESHOLD = 0.55;
    const KEYWORD_RESCUE_SEMANTIC_THRESHOLD = 0.45;

    const SEMANTIC_WEIGHT = 0.75;
    const KEYWORD_WEIGHT = 0.25;


    /* ==================================================
       CLASSEMENT SÉMANTIQUE
    ================================================== */

    function rankSemanticResults(
      query,
      semanticRows
    ) {

      const significantQueryWords =
        getSignificantWords(query);

      const conversational =
        isConversationalQuery(query);

      const semanticThreshold =
        conversational
          ? CONVERSATIONAL_SEMANTIC_THRESHOLD
          : SEMANTIC_THRESHOLD;

      const results = [];

      for (const row of semanticRows || []) {

        const signet = {

          id: String(row.id),

          title:
            row.title || "",

          url:
            row.url || "",

          resume_ia:
            row.resume_ia || "",

          saved_at:
            row.saved_at || "",

          embedding_version:
            row.embedding_version ?? null,

          est_lu:
            Boolean(row.est_lu)

        };


        /*
         * Si match_signets ne renvoie pas est_lu,
         * on récupère l'état depuis allSignets.
         */

        const localSignet =
          allSignets.find(
            s =>
              String(s.id) === String(row.id)
          );

        if (
          localSignet &&
          row.est_lu == null
        ) {
          signet.est_lu =
            Boolean(localSignet.est_lu);
        }


        const semanticScore =
          Number(row.similarity) || 0;

        const keywordScore =
          calculateKeywordScore(
            query,
            signet
          );


        const finalScore =
          semanticScore * SEMANTIC_WEIGHT +
          keywordScore * KEYWORD_WEIGHT;


        const keywordComplete =
          significantQueryWords.length > 0 &&
          keywordScore === 1;


        const semanticAccepted =
          semanticScore >= semanticThreshold;


        const keywordRescue =
          keywordComplete &&
          semanticScore >=
            KEYWORD_RESCUE_SEMANTIC_THRESHOLD;


        const accepted =
          semanticAccepted ||
          keywordRescue;


        if (!accepted) {
          continue;
        }


        results.push({

          ...signet,

          semantic_score:
            semanticScore,

          keyword_score:
            keywordScore,

          final_score:
            finalScore,

          keyword_complete:
            keywordComplete,

          rescue:
            keywordRescue,

          relevance:
            Math.round(finalScore * 100)

        });

      }


      results.sort(
        (a, b) =>
          b.final_score -
          a.final_score
      );


      return results;

    }


    /* ==================================================
       RECHERCHE CLASSIQUE
    ================================================== */

    async function rechercheClassique(query) {

      const { data, error } =
        await client.rpc(
          "recherche_classique",
          {
            search_query: query,
            match_count: 20
          }
        );

      if (error) {
        throw error;
      }

      return data || [];

    }


    /* ==================================================
       EMBEDDING DE RECHERCHE
    ================================================== */

    async function generateSearchEmbedding(query) {

      const { data, error } =
        await client.functions.invoke(
          "generate-search-embedding",
          {
            body: {
              query
            }
          }
        );

      if (error) {
        throw error;
      }

      const embedding =
        data?.embedding;

      if (
        !Array.isArray(embedding) ||
        embedding.length !== 768
      ) {
        throw new Error(
          "Embedding de recherche invalide."
        );
      }

      return embedding;

    }


    /* ==================================================
       RECHERCHE SÉMANTIQUE CLOUD
    ================================================== */

    async function rechercheSemantique(query) {

      const queryEmbedding =
        await generateSearchEmbedding(query);


      const { data, error } =
        await client.rpc(
          "match_signets",
          {
            query_embedding:
              queryEmbedding,

            match_threshold:
              0.45,

            match_count:
              20
          }
        );


      if (error) {
        throw error;
      }


      return rankSemanticResults(
        query,
        data || []
      );

    }


    /* ==================================================
       RECHERCHE PRINCIPALE
    ================================================== */

    async function rechercher() {

      const query =
        searchInput.value.trim();


      if (!query) {

        afficherSignets(
          allSignets
        );

        status.textContent =
          allSignets.length +
          " signet" +
          (
            allSignets.length > 1
              ? "s"
              : ""
          );

        return;

      }


      searchButton.disabled = true;

      status.textContent =
        "🔎 Recherche en cours…";


      try {

        /*
         * 1. RECHERCHE CLASSIQUE CLOUD
         */

        const classicResults =
          await rechercheClassique(
            query
          );


        if (
          classicResults.length > 0
        ) {

          afficherSignets(
            classicResults
          );

          status.textContent =
            classicResults.length +
            " résultat" +
            (
              classicResults.length > 1
                ? "s"
                : ""
            );

          return;

        }


        /*
         * 2. RECHERCHE SÉMANTIQUE
         */

        status.textContent =
          "🧠 Recherche sémantique en cours…";


        const semanticResults =
          await rechercheSemantique(
            query
          );


        afficherSignets(
          semanticResults,
          semanticResults.length > 0
        );


        if (
          semanticResults.length === 0
        ) {

          status.textContent =
            "Aucun signet ne correspond à cette recherche.";

        } else {

          status.textContent =
            semanticResults.length +
            " résultat" +
            (
              semanticResults.length > 1
                ? "s"
                : ""
            ) +
            " classé" +
            (
              semanticResults.length > 1
                ? "s"
                : ""
            ) +
            " par pertinence.";

        }

      } catch (error) {

        console.error(
          "❌ Recherche :",
          error
        );

        status.textContent =
          "❌ Erreur pendant la recherche.";

      } finally {

        searchButton.disabled = false;

      }

    }


    /* ==================================================
       FORMATAGE DU RÉSUMÉ
    ================================================== */

    function formatSummary(text) {

      const lines =
        String(text || "")
          .split(/\r?\n/);

      let html = "";
      let inList = false;


      function closeList() {

        if (inList) {
          html += "</ul>";
          inList = false;
        }

      }


      for (const rawLine of lines) {

        const line =
          rawLine.trim();


        if (!line) {
          continue;
        }


        const sectionMatch =
          line.match(
            /^##\*\*_?\s*(.*?)\s*_?\*\*##$/
          );


        if (sectionMatch) {

          closeList();

          html +=
            `<div class="summary-section-title">${
              escapeHtml(
                sectionMatch[1]
              )
            }</div>`;

          continue;

        }


        const bulletMatch =
          line.match(
            /^[-•*]\s+(.+)$/
          );


        if (bulletMatch) {

          if (!inList) {

            html +=
              '<ul class="summary-list">';

            inList = true;

          }

          html +=
            `<li>${escapeHtml(
              bulletMatch[1]
            )}</li>`;

          continue;

        }


        closeList();

        html +=
          `<p class="summary-paragraph">${
            escapeHtml(line)
          }</p>`;

      }


      closeList();

      return html;

    }


    /* ==================================================
       AFFICHAGE DES SIGNETS
    ================================================== */

    function afficherSignets(
      signets,
      showRelevance = false
    ) {

      signetsContainer.innerHTML = "";
      empty.classList.add("hidden");


      if (
        !signets ||
        signets.length === 0
      ) {

        empty.classList.remove(
          "hidden"
        );

        return;

      }


      signets.forEach(
        (signet) => {

          /*
           * Pour les résultats de recherche classique,
           * est_lu peut ne pas être renvoyé par la RPC.
           * On récupère alors l'état depuis allSignets.
           */

          const localSignet =
            allSignets.find(
              s =>
                String(s.id) === String(signet.id)
            );


          if (
            signet.est_lu == null &&
            localSignet
          ) {
            signet.est_lu =
              Boolean(localSignet.est_lu);
          }


          const article =
            document.createElement(
              "article"
            );


          article.className =
            "signet";


          if (Boolean(signet.est_lu)) {

            article.classList.add(
              "read"
            );

          }


          const date =
            signet.saved_at
              ? new Date(
                  signet.saved_at
                ).toLocaleString(
                  "fr-FR"
                )
              : "";


          const title =
            escapeHtml(
              signet.title ||
              "Sans titre"
            );


          const url =
            escapeHtml(
              signet.url ||
              "#"
            );


          article.innerHTML = `

            <div class="signet-header">

              <button
                type="button"
                class="title-button"
              >
                ${title}
              </button>

              <a
                class="external-link"
                href="${url}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ↗ Article
              </a>

            </div>

            ${
              date
                ? `
                  <div class="article-date">
                    ${escapeHtml(date)}
                  </div>
                `
                : ""
            }

            ${
              showRelevance &&
              signet.relevance != null
                ? `
                  <div class="relevance">
                    Pertinence :
                    ${signet.relevance} %
                  </div>
                `
                : ""
            }

            <div class="summary">
              ${formatSummary(
                signet.resume_ia
              )}
            </div>

            <div class="signet-actions">

              <button
                type="button"
                class="read-button"
              >
                ${
                  Boolean(signet.est_lu)
                    ? "☑ Non lu"
                    : "☐ Lu"
                }
              </button>

            </div>

          `;


          const titleButton =
            article.querySelector(
              ".title-button"
            );


          const readButton =
            article.querySelector(
              ".read-button"
            );


          /*
           * Bouton Lu / Non lu
           */

          readButton.addEventListener(
            "click",
            async () => {

              const newValue =
                !Boolean(signet.est_lu);


              readButton.disabled =
                true;


              const {
                error
              } =
                await client
                  .from("signets")
                  .update({
                    est_lu: newValue
                  })
                  .eq(
                    "id",
                    signet.id
                  );


              if (error) {

                console.error(
                  "Erreur mise à jour est_lu :",
                  error
                );

                readButton.disabled =
                  false;

                return;

              }


              /*
               * Mise à jour immédiate
               * de l'objet affiché.
               */

              signet.est_lu =
                newValue;


              /*
               * Mise à jour de la copie
               * principale en mémoire.
               */

              const localSignet =
                allSignets.find(
                  s =>
                    String(s.id) ===
                    String(signet.id)
                );


              if (localSignet) {

                localSignet.est_lu =
                  newValue;

              }


              /*
               * Mise à jour visuelle
               */

              article.classList.toggle(
                "read",
                newValue
              );


              readButton.textContent =
                newValue
                  ? "☑ Non lu"
                  : "☐ Lu";


              readButton.disabled =
                false;

            }
          );


          titleButton.addEventListener(
            "click",
            () => {

              const wasOpen =
                article.classList.contains(
                  "open"
                );


              /*
               * Un seul signet ouvert
               */

              document
                .querySelectorAll(
                  ".signet.open"
                )
                .forEach(
                  opened => {
                    opened.classList.remove(
                      "open"
                    );
                  }
                );


              if (!wasOpen) {

                article.classList.add(
                  "open"
                );

              }

            }
          );


          signetsContainer.appendChild(
            article
          );

        }
      );

    }


    /* ==================================================
       CHARGEMENT DES SIGNETS
    ================================================== */

    async function chargerSignets() {

      status.textContent =
        "Chargement des signets…";

      signetsContainer.innerHTML =
        "";

      empty.classList.add(
        "hidden"
      );


      const {
        data,
        error
      } =
        await client
          .from("signets")
          .select(
            "id, title, url, resume_ia, saved_at, embedding_version, est_lu"
          )
          .order(
            "saved_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "Erreur chargement signets :",
          error
        );

        status.textContent =
          "❌ Impossible de charger les signets.";

        return;

      }


      allSignets =
        Array.isArray(data)
          ? data
          : [];


      afficherSignets(
        allSignets
      );


      if (
        allSignets.length === 0
      ) {

        status.textContent =
          "Aucun signet enregistré.";

      } else {

        status.textContent =
          allSignets.length +
          " signet" +
          (
            allSignets.length > 1
              ? "s"
              : ""
          );

      }

    }


    /* ==================================================
       AUTHENTIFICATION
    ================================================== */

    async function afficherApplication(
      session
    ) {

      if (!session) {

        app.classList.add(
          "hidden"
        );

        loginSection.classList.remove(
          "hidden"
        );

        return;

      }


      loginSection.classList.add(
        "hidden"
      );

      app.classList.remove(
        "hidden"
      );


      userInfo.textContent =
        "Connecté : " +
        (
          session.user.email ||
          "utilisateur"
        );


      await chargerSignets();

    }


    loginBtn.addEventListener(
      "click",
      async () => {

        loginBtn.disabled =
          true;

        loginBtn.textContent =
          "Connexion…";


        const {
          error
        } =
          await client.auth
            .signInWithOAuth({
              provider: "google",

              options: {
                redirectTo:
                  "https://didioux2.github.io/mes-signets-ia-web/"
              }
            });


        if (error) {

          console.error(
            "Erreur Google OAuth :",
            error
          );

          loginBtn.disabled =
            false;

          loginBtn.textContent =
            "🔵 Se connecter avec Google";

          alert(
            "Erreur de connexion : " +
            error.message
          );

        }

      }
    );


    logoutBtn.addEventListener(
      "click",
      async () => {

        const {
          error
        } =
          await client.auth.signOut();


        if (error) {

          console.error(
            "Erreur déconnexion :",
            error
          );

          alert(
            "Erreur lors de la déconnexion."
          );

          return;

        }


        window.location.reload();

      }
    );


    /* ==================================================
       RECHERCHE : CLIC + ENTRÉE UNIQUEMENT
    ================================================== */

    searchButton.addEventListener(
      "click",
      rechercher
    );


    searchInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          rechercher();

        }

      }
    );


    resetSearchButton.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        afficherSignets(
          allSignets
        );

        status.textContent =
          allSignets.length +
          " signet" +
          (
            allSignets.length > 1
              ? "s"
              : ""
          );

      }
    );


    /* ==================================================
       SESSION SUPABASE
    ================================================== */

    client.auth.onAuthStateChange(
      async (
        _event,
        session
      ) => {

        await afficherApplication(
          session
        );

      }
    );


    async function init() {

      const {
        data,
        error
      } =
        await client.auth.getSession();


      if (error) {

        console.error(
          "Erreur récupération session :",
          error
        );

        loginSection.classList.remove(
          "hidden"
        );

        return;

      }


      await afficherApplication(
        data.session
      );

    }


    init();

  </script>

</body>
</html>
