<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Signets IA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f7fa;
      color: #222;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
    }

    .subtitle {
      color: #666;
      margin-top: 5px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    #loginBtn {
      background: #4285f4;
      color: white;
      font-weight: bold;
    }

    #logoutBtn {
      background: #444;
      color: white;
    }

    .hidden {
      display: none;
    }

    #loginSection {
      max-width: 500px;
      margin: 80px auto;
      background: white;
      padding: 35px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    #loginSection h2 {
      margin-top: 0;
    }

    #loginSection p {
      color: #666;
      margin-bottom: 25px;
    }

    #userInfo {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .signet {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .signet h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 20px;
    }

    .signet h2 a {
      color: #1a73e8;
      text-decoration: none;
    }

    .signet h2 a:hover {
      text-decoration: underline;
    }

    .date {
      color: #888;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .resume {
      line-height: 1.6;
      white-space: pre-wrap;
    }

    #status {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

  <!-- Zone de connexion -->
  <section id="loginSection" class="hidden">
    <h2>🔐 Bienvenue dans Mes Signets IA</h2>
    <p>Connectez-vous pour accéder à votre bibliothèque personnelle.</p>
    <button id="loginBtn">🔵 Se connecter avec Google</button>
  </section>

  <!-- Application -->
  <div id="app" class="hidden">

    <header>
      <div>
        <h1>🔖 Mes Signets IA</h1>
        <div class="subtitle">Votre bibliothèque personnelle</div>
      </div>

      <button id="logoutBtn">Déconnexion</button>
    </header>

    <div id="userInfo"></div>

    <div id="status">Chargement des signets...</div>

    <div id="signets"></div>

  </div>

  <script>
    const SUPABASE_URL = "https://imehbthvldsqmxobivka.supabase.co";

    const SUPABASE_KEY = "sb_publishable_voZTwjikja0soirZ1a2bsw_AZNRVsGh";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginSection = document.getElementById("loginSection");
    const app = document.getElementById("app");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userInfo = document.getElementById("userInfo");
    const status = document.getElementById("status");
    const signetsContainer = document.getElementById("signets");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function afficherApplication(session) {

      if (!session) {
        app.classList.add("hidden");
        loginSection.classList.remove("hidden");
        return;
      }

      loginSection.classList.add("hidden");
      app.classList.remove("hidden");

      userInfo.textContent =
        "Connecté : " + (session.user.email || "utilisateur");

      await chargerSignets();
    }

    async function chargerSignets() {

      status.textContent = "Chargement des signets...";
      signetsContainer.innerHTML = "";

      const { data, error } = await client
        .from("signets")
        .select("id, title, url, resume_ia, saved_at")
        .order("saved_at", { ascending: false });

      if (error) {
        console.error("Erreur chargement signets :", error);

        status.textContent =
          "❌ Impossible de charger les signets.";

        return;
      }

      if (!data || data.length === 0) {
        status.textContent = "Aucun signet enregistré.";
        return;
      }

      status.textContent =
        data.length + " signet" + (data.length > 1 ? "s" : "");

      data.forEach(signet => {

        const article = document.createElement("article");
        article.className = "signet";

        const date = signet.saved_at
          ? new Date(signet.saved_at).toLocaleString("fr-FR")
          : "";

        article.innerHTML = `
          <h2>
            <a href="${escapeHtml(signet.url)}"
               target="_blank"
               rel="noopener noreferrer">
              ${escapeHtml(signet.title)}
            </a>
          </h2>

          <div class="date">
            ${escapeHtml(date)}
          </div>

          <div class="resume">
            ${escapeHtml(signet.resume_ia)}
          </div>
        `;

        signetsContainer.appendChild(article);
      });
    }

    loginBtn.addEventListener("click", async () => {

      loginBtn.disabled = true;
      loginBtn.textContent = "Connexion...";

      const { error } = await client.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: "https://didioux2.github.io/mes-signets-ia-web/"
        }
      });

      if (error) {
        console.error("Erreur Google OAuth :", error);

        loginBtn.disabled = false;
        loginBtn.textContent = "🔵 Se connecter avec Google";

        alert("Erreur de connexion : " + error.message);
      }
    });

    logoutBtn.addEventListener("click", async () => {

      const { error } = await client.auth.signOut();

      if (error) {
        console.error("Erreur déconnexion :", error);
        alert("Erreur lors de la déconnexion.");
        return;
      }

      window.location.reload();
    });

    client.auth.onAuthStateChange(async (_event, session) => {
      await afficherApplication(session);
    });

    async function init() {

      const { data, error } = await client.auth.getSession();

      if (error) {
        console.error("Erreur récupération session :", error);
        loginSection.classList.remove("hidden");
        return;
      }

      await afficherApplication(data.session);
    }

    init();
  </script>

</body>
</html>
