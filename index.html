<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mes Signets IA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin-top: 6px;
      color: #666;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    #loginButton {
      background: #222;
      color: white;
    }

    #logoutButton {
      background: #e9ecef;
      color: #222;
    }

    #loginSection {
      text-align: center;
      padding: 100px 20px;
    }

    #loginSection h1 {
      margin-bottom: 10px;
    }

    #app {
      display: none;
    }

    #userInfo {
      margin-bottom: 18px;
      color: #666;
      font-size: 14px;
    }

    .searchBox {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid #d6dbe1;
      border-radius: 8px;
      background: white;
      font-size: 16px;
      outline: none;
    }

    #searchInput:focus {
      border-color: #888;
    }

    #searchButton {
      background: #222;
      color: white;
      min-width: 120px;
    }

    #searchButton:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin: 10px 0 18px;
      color: #666;
      font-size: 14px;
      min-height: 20px;
    }

    .signet {
      background: white;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .signet h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .signet h2 a {
      color: #222;
      text-decoration: none;
    }

    .signet h2 a:hover {
      text-decoration: underline;
    }

    .date {
      color: #888;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .resume {
      color: #444;
      line-height: 1.55;
      white-space: pre-line;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #777;
      background: white;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      header {
        align-items: flex-start;
      }

      h1 {
        font-size: 23px;
      }

      .searchBox {
        flex-direction: column;
      }

      #searchButton {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- ============================================================
       CONNEXION
       ============================================================ -->

  <section id="loginSection">
    <h1>🔖 Mes Signets IA</h1>
    <p class="subtitle">Votre bibliothèque personnelle</p>

    <br>

    <button id="loginButton">
      🔐 Se connecter avec Google
    </button>

    <div id="loginStatus"></div>
  </section>


  <!-- ============================================================
       APPLICATION
       ============================================================ -->

  <main id="app" class="container">

    <header>
      <div>
        <h1>🔖 Mes Signets IA</h1>
        <div class="subtitle">
          Votre bibliothèque personnelle
        </div>
      </div>

      <button id="logoutButton">
        Déconnexion
      </button>
    </header>

    <div id="userInfo"></div>


    <!-- ==========================================================
         RECHERCHE
         ========================================================== -->

    <div class="searchBox">

      <input
        type="search"
        id="searchInput"
        placeholder="🔎 Rechercher dans mes signets..."
        autocomplete="off"
      >

      <button id="searchButton">
        🔎 Rechercher
      </button>

    </div>

    <div id="status"></div>

    <section id="signets"></section>

  </main>


  <script>
    // ============================================================
    // SUPABASE
    // ============================================================

    const SUPABASE_URL =
      "https://imehbthvldsqmxobivka.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_voZTwjikja0soirZ1a2bsw_AZNRVsGh";

    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ============================================================
    // CONSTANTES RECHERCHE
    // ============================================================

    const SEMANTIC_THRESHOLD = 0.60;
    const CONVERSATIONAL_SEMANTIC_THRESHOLD = 0.55;
    const KEYWORD_RESCUE_SEMANTIC_THRESHOLD = 0.45;

    const SEMANTIC_WEIGHT = 0.75;
    const KEYWORD_WEIGHT = 0.25;

    const EMBEDDING_DIMENSION = 768;


    // ============================================================
    // STOPWORDS
    // Même liste que search.js
    // ============================================================

    const STOPWORDS = new Set([
      "a","ai","au","aux","avec","ce","ces","dans","de","des","du",
      "elle","en","es","et","eux","il","ils","je","la","le","les",
      "leur","leurs","lui","ma","mais","me","mes","mon","ne","nos",
      "notre","nous","on","ou","par","pas","pour","que","quel",
      "quelle","quelles","quels","qui","sa","se","sera","ses","son",
      "sur","ta","te","tes","toi","ton","tu","un","une","vos","votre",
      "vous","y"
    ]);


    // ============================================================
    // MOTS CONVERSATIONNELS
    // Même liste que search.js
    // ============================================================

    const CONVERSATIONAL_WORDS = new Set([
      "comment","pourquoi","explique","expliquer","parle","parler",
      "dis","dire","montre","montrer","cherche","chercher","trouve",
      "trouver","donne","donner","quel","quelle","quels","quelles"
    ]);


    // ============================================================
    // NORMALISATION
    // ============================================================

    function normalizeText(text) {
      return String(text || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s]/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
    }


    function normalizeSearchWord(word) {
      return normalizeText(word)
        .replace(/\s+/g, "");
    }


    function getSignificantWords(query) {
      return normalizeText(query)
        .split(/\s+/)
        .map(normalizeSearchWord)
        .filter(word =>
          word &&
          word.length > 1 &&
          !STOPWORDS.has(word)
        );
    }


    function isConversationalQuery(query) {
      const words =
        getSignificantWords(query);

      return words.some(word =>
        CONVERSATIONAL_WORDS.has(word)
      );
    }


    // ============================================================
    // SCORE LEXICAL
    // ============================================================

    function wordMatches(queryWord, signetText) {

      const normalizedText =
        normalizeText(signetText);

      const words =
        normalizedText.split(/\s+/);

      return words.some(word =>
        word === queryWord ||
        word.startsWith(queryWord) ||
        queryWord.startsWith(word)
      );
    }


    function calculateKeywordScore(query, signet) {

      const queryWords =
        getSignificantWords(query);

      if (!queryWords.length) {
        return 0;
      }

      const text = [
        signet.title,
        signet.titre,
        signet.resume_ia,
        signet.url
      ]
        .filter(Boolean)
        .join(" ");

      let matches = 0;

      for (const queryWord of queryWords) {

        if (
          wordMatches(
            queryWord,
            text
          )
        ) {
          matches++;
        }
      }

      return matches / queryWords.length;
    }


    // ============================================================
    // CLASSEMENT SÉMANTIQUE
    // Copie conforme de search.js
    // ============================================================

    function rankSemanticResults(
      query,
      semanticRows
    ) {

      const significantQueryWords =
        getSignificantWords(query);

      const conversational =
        isConversationalQuery(query);

      const semanticThreshold =
        conversational
          ? CONVERSATIONAL_SEMANTIC_THRESHOLD
          : SEMANTIC_THRESHOLD;

      console.log(
        "🔎 Classement des résultats Supabase :",
        query
      );

      console.log(
        "Seuil sémantique :",
        semanticThreshold
      );

      console.log(
        "Requête conversationnelle :",
        conversational
      );

      console.log(
        "Candidats pgvector :",
        semanticRows?.length || 0
      );

      const results = [];

      for (const row of semanticRows || []) {

        const signet = {
          id: String(row.id),

          title:
            row.title || "",

          url:
            row.url || "",

          resume_ia:
            row.resume_ia || "",

          saved_at:
            row.saved_at || "",

          embedding_version:
            row.embedding_version ?? null
        };


        const semanticScore =
          Number(row.similarity) || 0;


        const keywordScore =
          calculateKeywordScore(
            query,
            signet
          );


        const finalScore =
          semanticScore * SEMANTIC_WEIGHT +
          keywordScore * KEYWORD_WEIGHT;


        const keywordComplete =
          significantQueryWords.length > 0 &&
          keywordScore === 1;


        const semanticAccepted =
          semanticScore >= semanticThreshold;


        const keywordRescue =
          keywordComplete &&
          semanticScore >=
            KEYWORD_RESCUE_SEMANTIC_THRESHOLD;


        const accepted =
          semanticAccepted ||
          keywordRescue;


        console.log(
          `🔎 ${semanticScore.toFixed(4)} | ` +
          `mots : ${keywordScore.toFixed(4)} | ` +
          `final : ${finalScore.toFixed(4)} | ` +
          `lexical complet : ${
            keywordComplete ? "OUI" : "NON"
          } | ` +
          `secours : ${
            keywordRescue ? "OUI" : "NON"
          } | ` +
          `retenu : ${
            accepted ? "OUI" : "NON"
          } | ` +
          `${signet.title}`
        );


        if (!accepted) {
          continue;
        }


        results.push({
          ...signet,

          semantic_score:
            semanticScore,

          keyword_score:
            keywordScore,

          final_score:
            finalScore,

          keyword_complete:
            keywordComplete,

          rescue:
            keywordRescue,

          relevance:
            Math.round(finalScore * 100)
        });
      }


      results.sort(
        (a, b) =>
          b.final_score -
          a.final_score
      );


      console.log(
        "Résultats retenus :",
        results.length
      );

      console.log(
        "══════════════════════════════════════"
      );


      return results;
    }


    // ============================================================
    // ÉCHAPPEMENT HTML
    // ============================================================

    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ============================================================
    // FORMAT DATE
    // ============================================================

    function formatDate(value) {

      if (!value) {
        return "";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }

      return date.toLocaleDateString(
        "fr-FR",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );
    }


    // ============================================================
    // FORMAT RÉSUMÉ
    // ============================================================

    function formatResume(text) {

      if (!text) {
        return "";
      }

      return escapeHtml(text);
    }


    // ============================================================
    // AFFICHAGE
    // ============================================================

    function afficherSignets(signets) {

      const container =
        document.getElementById("signets");

      container.innerHTML = "";


      if (!signets || !signets.length) {

        container.innerHTML = `
          <div class="empty">
            Aucun signet trouvé.
          </div>
        `;

        return;
      }


      for (const signet of signets) {

        const article =
          document.createElement("article");

        article.className = "signet";


        const title =
          escapeHtml(
            signet.title ||
            signet.titre ||
            "Sans titre"
          );


        const url =
          escapeHtml(
            signet.url || "#"
          );


        const date =
          formatDate(
            signet.saved_at
          );


        const resume =
          formatResume(
            signet.resume_ia
          );


        article.innerHTML = `

          <h2>
            <a
              href="${url}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${title}
            </a>
          </h2>

          ${
            date
              ? `<div class="date">
                   📅 ${date}
                 </div>`
              : ""
          }

          ${
            resume
              ? `<div class="resume">
                   ${resume}
                 </div>`
              : ""
          }

        `;


        container.appendChild(
          article
        );
      }
    }


    // ============================================================
    // CHARGEMENT INITIAL
    // ============================================================

    let tousLesSignets = [];


    async function chargerSignets() {

      const status =
        document.getElementById("status");

      status.textContent =
        "Chargement de vos signets…";


      const {
        data,
        error
      } =
        await client
          .from("signets")
          .select(
            "id, title, titre, url, resume_ia, saved_at, embedding_version"
          )
          .order(
            "saved_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "❌ Erreur chargement signets :",
          error
        );

        status.textContent =
          "❌ Impossible de charger les signets.";

        return;
      }


      tousLesSignets =
        data || [];


      afficherSignets(
        tousLesSignets
      );


      status.textContent =
        `${tousLesSignets.length} signet(s)`;
    }


    // ============================================================
    // RECHERCHE CLASSIQUE CLOUD
    // ============================================================

    async function rechercheClassiqueCloud(
      query
    ) {

      console.log(
        "☁️ Recherche classique Supabase :",
        query
      );


      const {
        data,
        error
      } =
        await client.rpc(
          "recherche_classique",
          {
            search_query: query,
            match_count: 20
          }
        );


      if (error) {

        console.error(
          "❌ Recherche classique :",
          error
        );

        throw error;
      }


      return data || [];
    }


    // ============================================================
    // EMBEDDING DE RECHERCHE
    // Edge Function
    // ============================================================

    async function generateSearchEmbedding(
      query
    ) {

      console.log(
        "🧠 Génération embedding de recherche :",
        query
      );


      const {
        data,
        error
      } =
        await client.functions.invoke(
          "generate-search-embedding",
          {
            body: {
              query
            }
          }
        );


      if (error) {

        console.error(
          "❌ Edge Function embedding :",
          error
        );

        throw error;
      }


      const embedding =
        data?.embedding;


      if (
        !Array.isArray(embedding) ||
        embedding.length !== EMBEDDING_DIMENSION
      ) {

        throw new Error(
          `Embedding de recherche invalide : ${
            embedding?.length || 0
          } dimensions`
        );
      }


      console.log(
        "✅ Embedding reçu :",
        embedding.length,
        "dimensions"
      );


      return embedding;
    }


    // ============================================================
    // RECHERCHE SÉMANTIQUE CLOUD
    // ============================================================

    async function rechercheSemantiqueCloud(
      query
    ) {

      const queryEmbedding =
        await generateSearchEmbedding(
          query
        );


      console.log(
        "☁️ Appel RPC match_signets..."
      );


      const {
        data,
        error
      } =
        await client.rpc(
          "match_signets",
          {
            query_embedding:
              queryEmbedding,

            match_threshold:
              0.45,

            match_count:
              20
          }
        );


      if (error) {

        console.error(
          "❌ Recherche sémantique :",
          error
        );

        throw error;
      }


      console.log(
        "☁️ Résultats pgvector :",
        data?.length || 0
      );


      return data || [];
    }


    // ============================================================
    // RECHERCHE PRINCIPALE
    //
    // 1. classique
    // 2. si 0 → sémantique
    // 3. classement
    // ============================================================

    async function rechercherSignets() {

      const input =
        document.getElementById(
          "searchInput"
        );

      const button =
        document.getElementById(
          "searchButton"
        );

      const status =
        document.getElementById(
          "status"
        );


      const query =
        input.value.trim();


      // ----------------------------------------------------------
      // CHAMP VIDE
      // ----------------------------------------------------------

      if (!query) {

        afficherSignets(
          tousLesSignets
        );

        status.textContent =
          `${tousLesSignets.length} signet(s)`;

        return;
      }


      button.disabled = true;


      try {

        // --------------------------------------------------------
        // CLASSIQUE
        // --------------------------------------------------------

        status.textContent =
          "🔎 Recherche classique…";


        const classicRows =
          await rechercheClassiqueCloud(
            query
          );


        console.log(
          "☁️ Recherche classique :",
          classicRows.length,
          "résultat(s)."
        );


        // --------------------------------------------------------
        // CLASSIQUE TROUVÉ
        // --------------------------------------------------------

        if (classicRows.length > 0) {

          afficherSignets(
            classicRows
          );

          status.textContent =
            `${classicRows.length} résultat(s)`;

          return;
        }


        // --------------------------------------------------------
        // SÉMANTIQUE
        // --------------------------------------------------------

        console.log(
          "🧠 Aucun résultat classique cloud → recherche sémantique Supabase."
        );


        status.textContent =
          "🧠 Recherche sémantique…";


        const semanticRows =
          await rechercheSemantiqueCloud(
            query
          );


        const results =
          rankSemanticResults(
            query,
            semanticRows
          );


        console.log(
          "🎯 Résultats sémantiques finaux :",
          results.length
        );


        afficherSignets(
          results
        );


        status.textContent =
          results.length
            ? `${results.length} résultat(s) sémantique(s)`
            : "Aucun résultat.";


      } catch (error) {

        console.error(
          "❌ Erreur recherche :",
          error
        );


        status.textContent =
          `❌ Erreur de recherche : ${
            error.message || error
          }`;

      } finally {

        button.disabled = false;
      }
    }


    // ============================================================
    // ÉVÉNEMENTS RECHERCHE
    //
    // IMPORTANT :
    // aucun listener "input"
    // → aucune recherche pendant la frappe.
    // ============================================================

    document
      .getElementById("searchButton")
      .addEventListener(
        "click",
        rechercherSignets
      );


    document
      .getElementById("searchInput")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            rechercherSignets();
          }
        }
      );


    // ============================================================
    // GOOGLE LOGIN
    // ============================================================

    async function connecterGoogle() {

      const loginStatus =
        document.getElementById(
          "loginStatus"
        );


      loginStatus.textContent =
        "Connexion…";


      const {
        error
      } =
        await client.auth.signInWithOAuth(
          {
            provider: "google",

            options: {
              redirectTo:
                "https://didioux2.github.io/mes-signets-ia-web/"
            }
          }
        );


      if (error) {

        console.error(
          "❌ Erreur Google OAuth :",
          error
        );

        loginStatus.textContent =
          `❌ ${error.message}`;
      }
    }


    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        connecterGoogle
      );


    // ============================================================
    // LOGOUT
    // ============================================================

    async function deconnecter() {

      const {
        error
      } =
        await client.auth.signOut();


      if (error) {

        console.error(
          "❌ Erreur déconnexion :",
          error
        );

        return;
      }


      afficherEtatConnexion(
        null
      );
    }


    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        deconnecter
      );


    // ============================================================
    // ÉTAT DE CONNEXION
    // ============================================================

    async function afficherEtatConnexion(
      session
    ) {

      const loginSection =
        document.getElementById(
          "loginSection"
        );

      const app =
        document.getElementById(
          "app"
        );

      const userInfo =
        document.getElementById(
          "userInfo"
        );


      if (!session) {

        loginSection.style.display =
          "block";

        app.style.display =
          "none";

        userInfo.textContent =
          "";

        return;
      }


      loginSection.style.display =
        "none";

      app.style.display =
        "block";


      const user =
        session.user;


      const email =
        user?.email || "";


      userInfo.textContent =
        email
          ? `Connecté : ${email}`
          : "Connecté";


      await chargerSignets();
    }


    // ============================================================
    // AUTH STATE
    // ============================================================

    client.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        console.log(
          "🔐 Auth state :",
          event
        );


        await afficherEtatConnexion(
          session
        );
      }
    );


    // ============================================================
    // SESSION INITIALE
    // ============================================================

    async function init() {

      const {
        data,
        error
      } =
        await client.auth.getSession();


      if (error) {

        console.error(
          "❌ Erreur récupération session :",
          error
        );

        return;
      }


      await afficherEtatConnexion(
        data.session
      );
    }


    init();

  </script>

</body>
</html>
