  <style>

  </div>

  <script>
    const SUPABASE_URL = "https://imehbthvldsqmxobivka.supabase.co";

    const SUPABASE_KEY = "sb_publishable_voZTwjikja0soirZ1a2bsw_AZNRVsGh";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginSection = document.getElementById("loginSection");
    const app = document.getElementById("app");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userInfo = document.getElementById("userInfo");
    const searchInput = document.getElementById("searchInput");
    const status = document.getElementById("status");
    const signetsContainer = document.getElementById("signets");

    let tousLesSignets = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatResume(text) {
      let html = escapeHtml(text);

      /*
       * Transforme les titres de sections du type :
       * ##**_ TITRE _**##
       * ou
       * ##**_TITRE_**##
       *
       * en titres verts sans les marqueurs.
       */
      html = html.replace(
        /##\*\*_?\s*(.*?)\s*_?\*\*##/g,
        '<span class="resume-section-title">$1</span>'
      );

      return html;
    }

    async function afficherApplication(session) {

      if (!session) {
        app.classList.add("hidden");
        loginSection.classList.remove("hidden");
        return;
      }

      loginSection.classList.add("hidden");
      app.classList.remove("hidden");

      userInfo.textContent =
        "Connecté : " + (session.user.email || "utilisateur");

      await chargerSignets();
    }

    async function chargerSignets() {

      status.textContent = "Chargement des signets...";
      signetsContainer.innerHTML = "";

      const { data, error } = await client
        .from("signets")
        .select("id, title, url, resume_ia, saved_at")
        .order("saved_at", { ascending: false });

      if (error) {
        console.error("Erreur chargement signets :", error);

        status.textContent =
          "❌ Impossible de charger les signets.";

        return;
      }

      if (!data || data.length === 0) {
        tousLesSignets = [];
        status.textContent = "Aucun signet enregistré.";
        return;
      }

      tousLesSignets = data;

      afficherSignets(tousLesSignets);
    }

    function afficherSignets(signets) {

      signetsContainer.innerHTML = "";

      if (!signets || signets.length === 0) {
        status.textContent = "Aucun signet ne correspond à votre recherche.";
        return;
      }

      status.textContent =
        signets.length +
        " signet" +
        (signets.length > 1 ? "s" : "");

      signets.forEach(signet => {

        const article = document.createElement("article");
        article.className = "signet";

        const date = signet.saved_at
          ? new Date(signet.saved_at).toLocaleString("fr-FR")
          : "";

        article.innerHTML = `
          <h2>
            <a href="${escapeHtml(signet.url)}"
               target="_blank"
               rel="noopener noreferrer">
              ${escapeHtml(signet.title)}
            </a>
          </h2>

          <div class="date">
            ${escapeHtml(date)}
          </div>

          <div class="resume">
            ${formatResume(signet.resume_ia)}
          </div>
        `;

        signetsContainer.appendChild(article);
      });
    }

    function rechercherSignets() {

      const recherche =
        searchInput.value
          .trim()
          .toLowerCase();

      if (!recherche) {
        afficherSignets(tousLesSignets);
        return;
      }

      const resultats =
        tousLesSignets.filter(signet => {

          const titre =
            String(signet.title || "")
              .toLowerCase();

          const resume =
            String(signet.resume_ia || "")
              .toLowerCase();

          return (
            titre.includes(recherche) ||
            resume.includes(recherche)
          );
        });

      afficherSignets(resultats);
    }

    searchInput.addEventListener(
      "input",
      rechercherSignets
    );

    loginBtn.addEventListener("click", async () => {

      loginBtn.disabled = true;
      loginBtn.textContent = "Connexion...";

      const { error } = await client.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: "https://didioux2.github.io/mes-signets-ia-web/"
        }
      });

      if (error) {
        console.error("Erreur Google OAuth :", error);

        loginBtn.disabled = false;
        loginBtn.textContent = "🔵 Se connecter avec Google";

        alert("Erreur de connexion : " + error.message);
      }
    });

    logoutBtn.addEventListener("click", async () => {

      const { error } = await client.auth.signOut();

      if (error) {
        console.error("Erreur déconnexion :", error);
        alert("Erreur lors de la déconnexion.");
        return;
      }

      window.location.reload();
    });

    client.auth.onAuthStateChange(async (_event, session) => {
      await afficherApplication(session);
    });

    async function init() {

      const { data, error } = await client.auth.getSession();

      if (error) {
        console.error("Erreur récupération session :", error);
        loginSection.classList.remove("hidden");
        return;
      }

      await afficherApplication(data.session);
    }

    init();
  </script>

</body>
