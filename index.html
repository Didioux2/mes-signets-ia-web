<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mes Signets IA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 22px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin: 6px 0 0;
      opacity: 0.75;
      font-size: 14px;
    }

    #logoutBtn {
      border: 1px solid rgba(255,255,255,.3);
      background: transparent;
      color: white;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    #status {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .signet {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }

    .signet h2 {
      margin: 0 0 10px;
      font-size: 21px;
      line-height: 1.3;
    }

    .signet h2 a {
      color: #1d4ed8;
      text-decoration: none;
    }

    .signet h2 a:hover {
      text-decoration: underline;
    }

    .date {
      color: #777;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .resume {
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .empty {
      background: white;
      padding: 40px;
      border-radius: 14px;
      text-align: center;
      color: #666;
    }

    @media (max-width: 600px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      h1 {
        font-size: 24px;
      }

      main {
        margin-top: 20px;
        padding: 0 12px;
      }

      .signet {
        padding: 18px;
      }

      .signet h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <h1>🔖 Mes Signets IA</h1>
      <div class="subtitle">Votre bibliothèque personnelle</div>
    </div>

    <button id="logoutBtn">Déconnexion</button>
  </div>
</header>

<main>
  <div id="status">Chargement de vos signets...</div>
  <div id="signets"></div>
</main>

<script>
  const SUPABASE_URL =
    "https://imehbthvldsqmxobivka.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_voZTwjikja0soirZ1a2bsw_AZNRVsGh";

  const { createClient } = supabase;

  const client = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const status = document.getElementById("status");
  const signetsContainer = document.getElementById("signets");
  const logoutBtn = document.getElementById("logoutBtn");


  function formatDate(dateString) {
    if (!dateString) {
      return "";
    }

    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) {
      return dateString;
    }

    return date.toLocaleDateString("fr-FR", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });
  }


  function escapeHtml(value) {
    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  async function chargerSignets() {

    const {
      data: sessionData,
      error: sessionError
    } = await client.auth.getSession();

    if (sessionError) {
      status.textContent =
        "Erreur de session : " + sessionError.message;
      return;
    }

    const session = sessionData.session;

    if (!session) {
      status.textContent =
        "Vous devez vous connecter pour consulter vos signets.";
      logoutBtn.style.display = "none";
      return;
    }

    try {

      const {
        data,
        error
      } = await client
        .from("signets")
        .select("id, title, url, resume_ia, saved_at")
        .order("saved_at", {
          ascending: false
        });

      if (error) {
        throw error;
      }

      status.style.display = "none";

      if (!data || data.length === 0) {
        signetsContainer.innerHTML = `
          <div class="empty">
            🔖 Aucun signet enregistré.
          </div>
        `;
        return;
      }

      signetsContainer.innerHTML = data.map(signet => {

        const title =
          escapeHtml(signet.title || "Sans titre");

        const url =
          escapeHtml(signet.url || "#");

        const resume =
          escapeHtml(
            signet.resume_ia || "Aucun résumé disponible."
          );

        const date =
          formatDate(signet.saved_at);

        return `
          <article class="signet">

            <h2>
              <a
                href="${url}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${title}
              </a>
            </h2>

            <div class="date">
              📅 ${escapeHtml(date)}
            </div>

            <div class="resume">
              🤖 ${resume}
            </div>

          </article>
        `;

      }).join("");

    } catch (error) {

      console.error(error);

      status.textContent =
        "Erreur lors du chargement des signets : " +
        error.message;
    }
  }


  logoutBtn.addEventListener("click", async () => {

    const {
      error
    } = await client.auth.signOut();

    if (error) {
      alert(
        "Erreur lors de la déconnexion : " +
        error.message
      );
      return;
    }

    window.location.reload();
  });


  client.auth.onAuthStateChange((event, session) => {

    if (event === "SIGNED_IN" && session) {
      chargerSignets();
    }

    if (event === "SIGNED_OUT") {
      window.location.reload();
    }
  });


  chargerSignets();
</script>

</body>
</html>
